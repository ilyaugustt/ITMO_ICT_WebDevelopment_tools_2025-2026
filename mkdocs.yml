site_name: Travel API Documentation
site_description: Документация Travel API — лабораторная работа №1
site_url: https://ilyaugustt.github.io/ITMO_ICT_WebDevelopment_tools_2025-2026
docs_dir: docs

repo_url: https://github.com/ilyaugustt/ITMO_ICT_WebDevelopment_tools_2025-2026
repo_name: Dzhavatov_Ilyas

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy
  font:
    text: Roboto
    code: Roboto Mono

nav:
  - Главная: index.md
  - Установка и запуск: setup.md
  - Модели данных: models.md
  - Аутентификация: auth.md
  - API Endpoints: api.md
  - CRUD операции: crud.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_if_no_docstring: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
